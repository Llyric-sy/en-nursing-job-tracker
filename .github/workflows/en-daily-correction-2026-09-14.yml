name: EN tracker verification correction
on:
  push:
    paths:
      - '.github/workflows/en-daily-correction-2026-09-14.yml'
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct verified tracker data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('jobs.json')
          jobs=json.loads(p.read_text())
          byid={j['id']:j for j in jobs}
          # Fresh relisting verified 14 Sep: reopen existing Glengarry row, not NEW.
          j=byid['glengarry-cap-en-2026']
          j['status']='APPLY'
          j['listed_date']='2026-09-14'
          j['closing_date']='Not stated'
          j['chance']='🟡 Stretch – AHPRA EN required; acute hospital experience is preferred; current listing does not state a mandatory fixed minimum number of post-registration EN years'
          j['source']='Ramsay Health Care / SEEK / SimplyHired'
          j['url']='https://www.simplyhired.com.au/job/5giOI6jhsSJKsA0fVQNZv4TR9FeV0zhodOuEkPEUgEEckRFc8BsKxw'
          j.pop('closure_reason',None)
          # Correct the SKG Nuclear Medicine employment/pay fields to the exact current listing evidence.
          j=byid['skg-murdoch-en-nuclear-medicine-2026']
          j['employment']='Full-time'
          j['pay']='Not stated'
          p.write_text(json.dumps(jobs,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git commit -m "data: correct verified EN listing details 2026-09-14"
          git push
